<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Netflix Home</title>

    <link rel="stylesheet" href="home.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <img src="assets/images/logo.svg"
             class="logo"
             alt="Netflix Logo">

        <div class="profile">
            <img alt="profile" src="assets/images/Symbol.png">
        </div>

    </nav>

    <!-- HERO SECTION -->

    <section class="hero">

        <div class="overlay"></div>

        <div class="hero-content">

            <h1>Money Heist</h1>

            <p>
                A criminal mastermind plans the biggest heist in history.
            </p>

            <!-- BUTTONS -->

            <div class="hero-buttons">

                <a href="playBerlin" class="play-btn">
                    ▶ Play
                </a>

                <a href="more" class="info-btn">
                    More Info
                </a>

            </div>

        </div>

    </section>

    <!-- MOVIES -->

    <section class="movies">

        <!-- TRENDING -->

        <h2>Trending Now</h2>

        <div class="movie-row">

            <a href="playBerlin">
                <img src="assets/images/berlin.jpg" alt="Berlin">
            </a>

            <a href="playBerlin">
                <img src="assets/images/dark.jpg" alt="Dark">
            </a>

            <a href="playBerlin">
                <img src="assets/images/bb.jpg" alt="Breaking Bad">
            </a>

            <a href="playBerlin">
                <img src="assets/images/vk.png" alt="Vikings">
            </a>

            <a href="playBerlin">
                <img src="assets/images/pb.webp" alt="Peaky Blinders">
            </a>

        </div>

        <!-- POPULAR -->

        <h2>Popular on Netflix</h2>

        <div class="movie-row">

            <a href="playBerlin">
                <img src="assets/images/st.jfif" alt="">
            </a>

            <a href="playBerlin">
                <img src="assets/images/pm.jfif" alt="">
            </a>

            <a href="playBerlin">
                <img src="assets/images/sn.jfif" alt="">
            </a>

            <a href="playBerlin">
                <img src="assets/images/aib.jfif" alt="">
            </a>

            <a href="playBerlin">
                <img src="assets/images/tb.jfif" alt="">
            </a>

        </div>

        <!-- ACTION -->

        <h2>Action Movies</h2>

        <div class="movie-row">

            <a href="playBerlin">
                <img src="assets/images/tr.jpg" alt="">
            </a>

            <a href="playBerlin">
                <img src="assets/images/ug.jfif" alt="">
            </a>

            <a href="playBerlin">
                <img src="assets/images/obb.jpg" alt="">
            </a>

            <a href="playBerlin">
                <img src="assets/images/tsa.jfif" alt="">
            </a>

            <a href="playBerlin">
                <img src="assets/images/tia.jfif" alt="">
            </a>

        </div>

    </section>

</body>
</html>
