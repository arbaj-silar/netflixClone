<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Netflix Sign In</title>

    <link rel="stylesheet" href="sign.css">
</head>

<body>

    <div class="background"></div>

    <!-- NAVBAR -->
    <nav class="navbar">
        <img src="assets/images/logo.svg" class="logo" alt="Netflix Logo">
    </nav>

    <!-- SIGN IN BOX -->
    <div class="login-container">

        <form class="login-box" action="LoginServlet" method="post">

            <h1>Sign In</h1>

            <input type="email"
                   name="email"
                   placeholder="Email or phone number"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button type="submit">
                Sign In
            </button>

            <div class="remember">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Need help?</a>

            </div>

            <p class="signup-text">
                New to Netflix?
                <span>Sign up now.</span>
            </p>

        </form>

    </div>

</body>
</html>
